<script id="sct-final-contact-cta-v3-js">
(function () {
  function textOf(el) {
    return String((el && el.textContent) || "").replace(/\s+/g, " ").trim();
  }

  function findContactSection() {
    var exact = document.getElementById("contact");
    if (exact) return exact;

    var nodes = Array.prototype.slice.call(document.querySelectorAll("section, div, footer"));
    for (var i = 0; i < nodes.length; i++) {
      var t = textOf(nodes[i]);
      if (/GET IN TOUCH/i.test(t) && /(03306335588|info@safetychecktestltd\.co\.uk|WhatsApp|Get It Moving)/i.test(t)) {
        return nodes[i];
      }
    }

    return null;
  }

  function render() {
    var section = findContactSection();
    if (!section) return false;

    if (section.getAttribute("data-sct-contact-v3") === "done" && section.querySelector(".sct-contact-shell")) {
      return true;
    }

    section.id = "contact";
    section.className = "sct-final-contact-cta-v3";
    section.setAttribute("data-sct-contact-v3", "done");

    section.innerHTML = ''
      + '<div class="sct-contact-shell">'
      + '  <div class="sct-contact-copy">'
      + '    <div class="sct-contact-pill">Get In Touch</div>'
      + '    <h2>Need removals, flatbed van support or site logistics?</h2>'
      + '    <p>Removals, flatbed van support and site logistics can also be arranged through our sister company, <strong>Get It Moving</strong>.</p>'
      + '  </div>'
      + '  <div class="sct-contact-actions">'
      + '    <a class="sct-contact-card" href="tel:03306335588"><span>Call Us</span><b>03306335588</b></a>'
      + '    <a class="sct-contact-card" href="mailto:info@safetychecktestltd.co.uk"><span>Email Us</span><b>info@safetychecktestltd.co.uk</b></a>'
      + '    <div class="sct-contact-buttons">'
      + '      <a class="sct-whatsapp-btn" href="https://wa.me/447379264328" target="_blank" rel="noopener">Message on WhatsApp</a>'
      + '      <a class="sct-moving-btn" href="https://www.getitmoving.co.uk" target="_blank" rel="noopener">Book Removals / Flatbed</a>'
      + '    </div>'
      + '  </div>'
      + '</div>';

    return true;
  }

  function start() {
    render();
    setTimeout(render, 400);
    setTimeout(render, 1000);
    setTimeout(render, 2000);

    setInterval(function () {
      var section = document.getElementById("contact");
      if (!section || !section.querySelector(".sct-contact-shell")) {
        render();
      }
    }, 1500);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
