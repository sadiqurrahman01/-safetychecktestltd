<script id="sct-contact-readable-final-js">
(function () {
  function cleanText(value) {
    return String(value || "").replace(/\s+/g, " ").trim();
  }

  function findContactSection() {
    var byId = document.getElementById("contact");
    if (byId) return byId;

    var links = Array.prototype.slice.call(document.querySelectorAll("a"));
    var contactLink = links.find(function (a) {
      var href = String(a.getAttribute("href") || "").toLowerCase();
      return href.indexOf("wa.me") !== -1 ||
             href.indexOf("whatsapp") !== -1 ||
             href.indexOf("getitmoving") !== -1;
    });

    if (contactLink) {
      return contactLink.closest("section") || contactLink.closest("footer") || contactLink.closest("div");
    }

    var sections = Array.prototype.slice.call(document.querySelectorAll("section, footer, div"));
    return sections.find(function (el) {
      var t = cleanText(el.textContent);
      return /GET IN TOUCH/i.test(t) && /03306335588/.test(t);
    }) || null;
  }

  function markReadableCard(section, text) {
    var all = Array.prototype.slice.call(section.querySelectorAll("*"));
    var matches = all.filter(function (el) {
      return cleanText(el.textContent).indexOf(text) !== -1;
    });

    if (!matches.length) return;

    var smallest = matches[matches.length - 1];
    var card = smallest.closest("a, button, div, li") || smallest;

    while (
      card &&
      card.parentElement &&
      card.parentElement !== section &&
      card.offsetHeight < 55
    ) {
      card = card.parentElement;
    }

    if (card) card.classList.add("sct-contact-info-readable");
  }

  function applyFix() {
    var section = findContactSection();
    if (!section) return;

    section.classList.add("sct-contact-readable-final");

    markReadableCard(section, "03306335588");
    markReadableCard(section, "info@safetychecktestltd.co.uk");

    var tel = section.querySelector('a[href^="tel:"]');
    if (tel) (tel.closest("div") || tel).classList.add("sct-contact-info-readable");

    var mail = section.querySelector('a[href^="mailto:"]');
    if (mail) (mail.closest("div") || mail).classList.add("sct-contact-info-readable");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", applyFix);
  } else {
    applyFix();
  }

  setTimeout(applyFix, 400);
  setTimeout(applyFix, 1000);
})();
</script>
