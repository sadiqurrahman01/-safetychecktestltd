<script id="sct-contact-final-visible-js">
(function () {
  function clean(value) {
    return String(value || "").replace(/\s+/g, " ").trim();
  }

  function findContactSection() {
    var byId = document.getElementById("contact");
    if (byId) return byId;

    var candidates = Array.prototype.slice.call(document.querySelectorAll("section, div, footer"));
    return candidates.find(function (el) {
      var text = clean(el.textContent);
      return /GET IN TOUCH/i.test(text) && /03306335588|info@safetychecktestltd\.co\.uk|WhatsApp/i.test(text);
    }) || null;
  }

  function buildContact() {
    var section = findContactSection();
    if (!section) return false;

    if (section.getAttribute("data-sct-contact-final") === "yes") return true;
    section.setAttribute("data-sct-contact-final", "yes");

    section.id = "contact";
    section.className = "sct-contact-final-box";

    section.innerHTML = ''
      + '<div class="sct-contact-final-grid">'
      + '  <div>'
      + '    <div class="sct-contact-final-label">Get In Touch</div>'
      + '    <h2>Need removals, flatbed van support or site logistics?</h2>'
      + '    <p>Removals, flatbed van support and site logistics can also be arranged through our sister company, <strong>Get It Moving</strong>.</p>'
      + '  </div>'
      + '  <div class="sct-contact-final-actions">'
      + '    <a class="sct-contact-final-card" href="tel:03306335588">'
      + '      <span>Call Us</span>'
      + '      <b>03306335588</b>'
      + '    </a>'
      + '    <a class="sct-contact-final-card" href="mailto:info@safetychecktestltd.co.uk">'
      + '      <span>Email Us</span>'
      + '      <b>info@safetychecktestltd.co.uk</b>'
      + '    </a>'
      + '    <div class="sct-contact-final-buttons">'
      + '      <a class="sct-contact-final-whatsapp" href="https://wa.me/447379264328" target="_blank" rel="noopener">Message on WhatsApp</a>'
      + '      <a class="sct-contact-final-moving" href="https://www.getitmoving.co.uk" target="_blank" rel="noopener">Book Removals / Flatbed</a>'
      + '    </div>'
      + '  </div>'
      + '</div>';

    return true;
  }

  function run() {
    if (buildContact()) return;
    setTimeout(buildContact, 500);
    setTimeout(buildContact, 1200);
    setTimeout(buildContact, 2200);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else {
    run();
  }
})();
</script>
