<script id="sct-get-in-touch-premium-final-js">
(function () {
  function cleanText(value) {
    return String(value || "").replace(/\s+/g, " ").trim();
  }

  function findContactSection() {
    var nodes = Array.prototype.slice.call(document.querySelectorAll("section, footer, div"));
    var best = null;

    nodes.forEach(function (node) {
      var text = cleanText(node.innerText);
      if (!text) return;

      var hasGetInTouch = /GET IN TOUCH/i.test(text);
      var hasPhone = /03306335588/.test(text);
      var hasEmail = /info@safetychecktestltd\.co\.uk/i.test(text);
      var hasWhatsapp = /Message on WhatsApp/i.test(text);

      if (hasGetInTouch && hasPhone && hasEmail && hasWhatsapp) {
        if (!best || text.length < cleanText(best.innerText).length) {
          best = node;
        }
      }
    });

    return best;
  }

  function makeInfoCard(label, value, href) {
    var card = document.createElement("div");
    card.className = "sct-contact-info-card";

    var lab = document.createElement("span");
    lab.textContent = label;
    card.appendChild(lab);

    if (href) {
      var a = document.createElement("a");
      a.href = href;
      a.textContent = value;
      card.appendChild(a);
    } else {
      var strong = document.createElement("strong");
      strong.textContent = value;
      card.appendChild(strong);
    }

    return card;
  }

  function applyFix() {
    var section = findContactSection();
    if (!section || section.classList.contains("sct-contact-premium-final")) return;

    section.classList.add("sct-contact-premium-final");

    var text = cleanText(section.innerText);
    var whatsapp = section.querySelector('a[href*="wa.me"], a[href*="whatsapp"]');
    var getMoving = section.querySelector('a[href*="getitmoving"]');

    if (!getMoving) {
      getMoving = document.createElement("a");
      getMoving.href = "https://www.getitmoving.co.uk/";
      getMoving.target = "_blank";
      getMoving.rel = "noopener";
      getMoving.textContent = "Book Removals / Flatbed";
    }

    if (!whatsapp) {
      whatsapp = Array.prototype.slice.call(section.querySelectorAll("a, button")).find(function (el) {
        return /Message on WhatsApp/i.test(cleanText(el.innerText || el.textContent));
      });
    }

    var heading = Array.prototype.slice.call(section.querySelectorAll("h1,h2,h3")).find(function (h) {
      return /Need removals|Need help|GET IN TOUCH/i.test(cleanText(h.innerText));
    });

    var copy = Array.prototype.slice.call(section.querySelectorAll("p")).find(function (p) {
      return /Get It Moving|removals|flatbed|site logistics/i.test(cleanText(p.innerText));
    });

    var inner = document.createElement("div");
    inner.className = "sct-contact-inner";

    var left = document.createElement("div");
    left.className = "sct-contact-copy";

    var label = document.createElement("div");
    label.className = "sct-contact-label";
    label.textContent = "GET IN TOUCH";

    var h = document.createElement("h2");
    h.textContent = heading && !/GET IN TOUCH/i.test(cleanText(heading.innerText))
      ? cleanText(heading.innerText)
      : "Need removals, flatbed van support or site logistics?";

    var p = document.createElement("p");
    p.innerHTML = copy
      ? copy.innerHTML
      : 'Removals, flatbed van support and site logistics can also be arranged through our sister company, <strong>Get It Moving</strong>.';

    left.appendChild(label);
    left.appendChild(h);
    left.appendChild(p);

    var right = document.createElement("div");
    right.className = "sct-contact-actions";

    right.appendChild(makeInfoCard("CALL US", "03306335588", "tel:03306335588"));
    right.appendChild(makeInfoCard("EMAIL US", "info@safetychecktestltd.co.uk", "mailto:info@safetychecktestltd.co.uk"));

    var buttons = document.createElement("div");
    buttons.className = "sct-contact-buttons";

    if (whatsapp) {
      whatsapp.textContent = "Message on WhatsApp";
      buttons.appendChild(whatsapp);
    }

    getMoving.textContent = "Book Removals / Flatbed";
    buttons.appendChild(getMoving);

    right.appendChild(buttons);

    inner.appendChild(left);
    inner.appendChild(right);

    section.innerHTML = "";
    section.appendChild(inner);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", applyFix);
  } else {
    applyFix();
  }

  setTimeout(applyFix, 600);
})();
</script>
