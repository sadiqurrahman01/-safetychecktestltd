<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Requests | Safety Check Test</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#0f172a}
    header{background:#071a3d;color:#fff;padding:22px}
    .wrap{max-width:1200px;margin:auto;padding:22px}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
    h1{margin:0;font-size:28px}
    .muted{color:#64748b}
    .btn{border:0;border-radius:10px;padding:10px 14px;background:#0b5fff;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
    .btn-light{background:#e2e8f0;color:#0f172a}
    .btn-danger{background:#dc2626;color:#fff}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:18px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;box-shadow:0 8px 20px rgba(15,23,42,.06)}
    .title{font-size:20px;font-weight:800;margin-bottom:6px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .label{font-size:12px;text-transform:uppercase;color:#64748b;font-weight:800}
    .value{font-weight:700;word-break:break-word}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    .status{margin-top:14px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px}
    .empty{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-top:18px}
    @media(max-width:650px){.row{grid-template-columns:1fr}.wrap{padding:14px}}
  </style>
</head>
<body>
  <header>
    <div class="wrap top">
      <div>
        <h1>Portal Requests</h1>
        <div>Separate queue for portal onboarding requests.</div>
      </div>
      <div>
        <a class="btn btn-light" href="/admin-completion/">Back to Admin Completion</a>
        <button class="btn" onclick="loadRequests()">Refresh</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="status" class="status">Loading...</div>
    <div id="requests" class="grid"></div>
  </main>

<script>
const API = 'https://api.safetychecktestltd.co.uk';

function getToken(){
  return localStorage.getItem('sctAdminToken') ||
         localStorage.getItem('sct_admin_token') ||
         localStorage.getItem('adminToken') ||
         sessionStorage.getItem('sctAdminToken') ||
         sessionStorage.getItem('sct_admin_token') ||
         sessionStorage.getItem('adminToken') || '';
}

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function fmtDate(v){
  if(!v) return '-';
  try { return new Date(v).toLocaleString('en-GB'); } catch(e){ return String(v); }
}

function setStatus(msg){
  document.getElementById('status').textContent = msg;
}

function encodeJob(job){
  return encodeURIComponent(JSON.stringify(job));
}

async function api(path, options){
  const token = getToken();
  if(!token) throw new Error('Admin token missing. Open admin first and log in, then reopen Portal Requests.');
  const res = await fetch(API + path, {
    ...options,
    headers: {
      ...(options && options.headers ? options.headers : {}),
      Authorization: 'Bearer ' + token,
      'Content-Type': 'application/json'
    }
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok || data.ok === false){
    throw new Error(data.message || data.error || 'Request failed');
  }
  return data;
}

async function loadRequests(){
  const box = document.getElementById('requests');
  box.innerHTML = '';
  setStatus('Loading...');
  try{
    const data = await api('/api/admin/portal-jobs', { method:'GET' });
    const requests = data.jobs || data.requests || data.portalJobs || [];
    if(!requests.length){
      setStatus('Loaded 0 portal request(s).');
      box.innerHTML = '<div class="empty">No portal requests found.</div>';
      return;
    }
    setStatus('Loaded ' + requests.length + ' portal request(s). Use Assign Job, Assign To Employee, Auto Assign, or Delete.');
    box.innerHTML = requests.map(renderCard).join('');
  }catch(err){
    console.error(err);
    setStatus(err.message || 'Failed to load portal requests.');
    box.innerHTML = '<div class="empty">' + esc(err.message || 'Failed to load portal requests.') + '</div>';
  }
}

function renderCard(job){
  const id = esc(job._id || job.id || '');
  const ref = esc(job.reference || job.jobId || job.ref || id);
  return `
    <div class="card">
      <div class="title">${esc(job.organisationName || job.businessName || 'Portal Access Request')}</div>
      <div class="muted">Reference: ${ref} | Updated: ${esc(fmtDate(job.updatedAt || job.createdAt))}</div>

      <div class="actions">
        <button class="btn btn-light" onclick="window.print()">Print</button>
        <button class="btn btn-danger" onclick="deletePortalRequest('${id}','${ref}')">Delete</button>
      </div>

      <div class="row">
        <div><div class="label">Service</div><div class="value">${esc(job.serviceType || job.service || 'Portal Access')}</div></div>
        <div><div class="label">Organisation</div><div class="value">${esc(job.organisationName || '-')}</div></div>
        <div><div class="label">Contact</div><div class="value">${esc(job.contactName || job.name || '-')}</div></div>
        <div><div class="label">Email</div><div class="value">${esc(job.email || '-')}</div></div>
        <div><div class="label">Phone</div><div class="value">${esc(job.phone || '-')}</div></div>
        <div><div class="label">Postcode</div><div class="value">${esc(job.postcode || '-')}</div></div>
        <div><div class="label">Address</div><div class="value">${esc(job.address || job.siteAddress || job.addressLine1 || '-')}</div></div>
        <div><div class="label">Source</div><div class="value">${esc(job.source || 'portal_request_access')}</div></div>
      </div>

      <div style="margin-top:12px">
        <div class="label">Description</div>
        <div class="value">${esc(job.description || job.notes || job.message || '-')}</div>
      </div>

      <div class="actions">
        <button class="btn" onclick='assignPortalJob("${encodeJob(job)}")'>Assign Job</button>
        <button class="btn" onclick='assignPortalJobToEmployee("${encodeJob(job)}")'>Assign To Employee</button>
        <button class="btn" onclick='autoAssignPortalJob("${encodeJob(job)}")'>Auto Assign</button>
        <a class="btn btn-light" href="/admin/">Open Admin</a>
      </div>
    </div>
  `;
}

async function deletePortalRequest(id, ref){
  const safeId = String(id || '').trim();
  if(!safeId){
    alert('Could not delete: missing request ID.');
    return;
  }
  if(!confirm('Delete portal access request ' + (ref || safeId) + '?')) return;

  try{
    await api('/api/admin/portal-jobs/' + encodeURIComponent(safeId), { method:'DELETE' });
    setStatus('Deleted portal request ' + (ref || safeId));
    await loadRequests();
  }catch(err){
    console.error(err);
    alert('Delete failed: ' + (err.message || err));
  }
}

function decodeJob(encoded){
  try { return JSON.parse(decodeURIComponent(encoded)); } catch(e){ return {}; }
}

function assignPortalJob(encodedJob){
  const job = decodeJob(encodedJob);
  localStorage.setItem('sctPortalAssignDraft', JSON.stringify(job));
  window.location.href = '/admin-completion/';
}

function assignPortalJobToEmployee(encodedJob){
  const job = decodeJob(encodedJob);
  localStorage.setItem('sctPortalAssignDraft', JSON.stringify(job));
  window.location.href = '/admin-employees/';
}

function autoAssignPortalJob(encodedJob){
  const job = decodeJob(encodedJob);
  localStorage.setItem('sctPortalAutoAssignDraft', JSON.stringify(job));
  window.location.href = '/admin-employees/';
}

document.addEventListener('DOMContentLoaded', loadRequests);
</script>
</body>
</html>
